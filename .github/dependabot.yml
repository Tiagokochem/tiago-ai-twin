version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule: {interval: weekly}
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: {interval: weekly}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
