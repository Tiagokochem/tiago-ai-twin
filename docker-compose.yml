name: tiago-ai-twin

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-twin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only: reachable from the host for dev tools, never public.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-twin}
      KNOWLEDGE_DIR: /app/knowledge
      PERSONA_PATH: /app/persona.yaml
    volumes:
      - ./knowledge:/app/knowledge:ro
      - ./persona.yaml:/app/persona.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Lets the API reach an Evolution API running on the same VPS outside this stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:-}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      EMBED_ORIGINS: ${EMBED_ORIGINS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
