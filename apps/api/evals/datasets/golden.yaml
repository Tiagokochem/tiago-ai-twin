# Golden set for retrieval and answer evaluation.
# expected_docs: knowledge document ids (without language prefix); a hit is
#   any expected document among the top-k retrieved chunks.
# facts: short strings the answer should contain (case-insensitive; any of
#   the "|"-separated alternatives counts).
cases:
  - id: ai-experience
    expected_docs: [experience, faq, skills, profile]
    pt: {question: "Qual é a sua experiência com IA?", facts: ["RAG", "LangChain|LangGraph"]}
    en: {question: "What is your experience with AI?", facts: ["RAG", "LangChain|LangGraph"]}

  - id: langgraph
    expected_docs: [skills, project-tiago-ai-twin, profile, project-other-projects, project-langchain-langgraph]
    pt: {question: "Você já trabalhou com LangGraph?", facts: ["LangGraph"]}
    en: {question: "Have you worked with LangGraph?", facts: ["LangGraph"]}

  - id: langchain-projects
    expected_docs: [project-langchain-langgraph, project-tiago-ai-twin, project-other-projects]
    pt: {question: "Quais projetos você usou LangChain?", facts: ["LangGraph|LangChain", "Tiago AI|medical-appointment|autonomous-langchain"]}
    en: {question: "Which projects did you use LangChain on?", facts: ["LangGraph|LangChain", "Tiago AI|medical-appointment|autonomous-langchain"]}

  - id: rag-systems
    expected_docs: [experience, skills, project-tiago-ai-twin, profile, faq]
    pt: {question: "Você já construiu sistemas de RAG e busca semântica?", facts: ["embeddings|vetoria"]}
    en: {question: "Have you built RAG or semantic search systems?", facts: ["embeddings|vector"]}

